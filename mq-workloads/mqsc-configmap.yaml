apiVersion: v1
kind: ConfigMap
metadata:
  name: qmgr-gitops-mqsc
  namespace: mq-argocd
data:
  gitops.mqsc: |
    * Declarative MQSC managed by ArgoCD GitOps
    DEFINE QLOCAL(GITOPS.DEMO.IN) REPLACE DEFPSIST(YES) MAXDEPTH(50000)
    DEFINE QLOCAL(GITOPS.DEMO.OUT) REPLACE DEFPSIST(YES) MAXDEPTH(50000)
    DEFINE QLOCAL(DEAD.LETTER.QUEUE) REPLACE
    ALTER QMGR DEADQ(DEAD.LETTER.QUEUE)
    DEFINE CHANNEL(GITOPS.APP.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) SSLCAUTH(OPTIONAL) REPLACE
    ALTER QMGR CHLAUTH(DISABLED)
    REFRESH SECURITY TYPE(CONNAUTH)
